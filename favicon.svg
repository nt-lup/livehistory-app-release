<?xml version="1.0" encoding="utf-8"?>
<svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <style>
      .cal-stroke { stroke: #ffffff; stroke-opacity: 0.85; fill: none; }
      .cal-fill { fill: #ffffff; fill-opacity: 0.9; }
      .ticket-stroke { stroke: url(#liveGrad); }
      .ticket-fill { fill: url(#liveGrad); }
      .ticket-base { fill: #050a14; }
      .glow-fx { filter: url(#neonGlow); }
      
      
    </style>

    <!-- 透過ONのときはこの背景は描画されませんが、OFFの時のために残しています -->
    <radialGradient id="simpleBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="65%" stop-color="#04020a" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- ライブの色合いグラデーション -->
    <linearGradient id="liveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>

    <!-- 輪郭重視の発光フィルター -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- カレンダー切り抜き用のマスク定義 -->
    <mask id="cutoutMask">
      <rect width="512" height="512" fill="white" />
      
            <g transform="translate(256, 275) rotate(-12)">
              <path d="M -164,-105 L -80,-105 A 20,20 0 0,0 -40,-105 L 164,-105 A 36,36 0 0,1 200,-69 L 200,69 A 36,36 0 0,1 164,105 L -40,105 A 20,20 0 0,0 -80,105 L -164,105 A 36,36 0 0,1 -200,69 L -200,-69 A 36,36 0 0,1 -164,-105 Z" fill="black" stroke="black" stroke-width="48" stroke-linejoin="round" />
            </g>
          
    </mask>
  </defs>

  <!-- 透過背景スイッチがOFFの場合のみベース背景を描画 -->
  <rect width="512" height="512" rx="140" fill="url(#simpleBg)" />
  
  <g mask="url(#cutoutMask)">
    <!-- カレンダー枠の大きさも、OKをいただいた時の幅380x320に戻しています -->
    <rect x="66" y="110" width="380" height="320" rx="40" class="cal-stroke" stroke-width="32" stroke-linejoin="round" />
    <rect x="130" y="36" width="50" height="100" rx="25" class="cal-fill" />
    <rect x="332" y="36" width="50" height="100" rx="25" class="cal-fill" />
  </g>
  
            <g transform="translate(256, 275) rotate(-12)" class="glow-fx">
              <path d="M -164,-105 L -80,-105 A 20,20 0 0,0 -40,-105 L 164,-105 A 36,36 0 0,1 200,-69 L 200,69 A 36,36 0 0,1 164,105 L -40,105 A 20,20 0 0,0 -80,105 L -164,105 A 36,36 0 0,1 -200,69 L -200,-69 A 36,36 0 0,1 -164,-105 Z" class="ticket-base" />
              <path d="M -164,-105 L -80,-105 A 20,20 0 0,0 -40,-105 L 164,-105 A 36,36 0 0,1 200,-69 L 200,69 A 36,36 0 0,1 164,105 L -40,105 A 20,20 0 0,0 -80,105 L -164,105 A 36,36 0 0,1 -200,69 L -200,-69 A 36,36 0 0,1 -164,-105 Z" class="ticket-stroke" stroke-width="32" stroke-linejoin="round" fill="none" />
              <g class="ticket-fill">
                <circle cx="-60" cy="-60" r="14" />
                <circle cx="-60" cy="-20" r="14" />
                <circle cx="-60" cy="20" r="14" />
                <circle cx="-60" cy="60" r="14" />
              </g>
            </g>
</svg>